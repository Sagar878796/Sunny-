name: Update JSON Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl -L --fail \
            "https://lemajekaat.streamxlive.workers.dev/" \
            -o playlist.json

      - name: Validate JSON
        run: |
          jq empty playlist.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --cached --quiet || git commit -m "Update playlist JSON"
          git push
